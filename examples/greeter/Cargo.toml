[package]
name = "greeter"
description = "Hello world over SafeVerbs: one SEND into one receive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bincode = "1"
futures = "0.3.34"
safeverbs = { version = "0.1.0", path = "../../crates/safeverbs", features = ["serde"] }

[[bin]]
name = "greeter_client"
path = "src/client.rs"

[[bin]]
name = "greeter_server"
path = "src/server.rs"
