[package]
name = "uchan"
description = "An unreliable channel: RDMA WRITEs on UC with sequence numbers as immediate data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
bincode = "1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
safeverbs = { version = "0.1.0", path = "../../crates/safeverbs", features = ["serde"] }
serde = "1.0.229"
