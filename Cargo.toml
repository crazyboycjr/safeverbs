[workspace]
resolver = "3"
members = [
    "crates/safeverbs-sys",
    "crates/safeverbs-core",
    "crates/safeverbs",
    "examples/event_loop",
    "examples/greeter",
    "examples/perftest",
    "examples/uchan",
    "demo",
]
# Its own workspace, so that it verifies on a plain clone (scripts/verify.sh).
exclude = ["crates/safeverbs-spec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/crazyboycjr/safeverbs"
